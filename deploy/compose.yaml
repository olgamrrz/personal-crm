# Production on the server: docker compose project "prod" in /opt/crm/prod.
# GitHub Actions uploads this file and deploy.sh there; .env next to them holds the settings
# (see .env.example). APP_IMAGE is set by deploy.sh.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE is not set, deploy with deploy.sh}
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  depends_on:
    db:
      condition: service_healthy
  logging: *logging

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    <<: *app
    restart: unless-stopped
    ports:
      # Localhost only: nginx on this server proxies app.olgamrzvcrm.ru here
      - "127.0.0.1:3000:3000"

  # One-off containers from the app image: docker compose -p prod run --rm migrate|seed
  migrate:
    <<: *app
    command: ["node", "tools/scripts/migrate.mts"]
    profiles: [tools]

  seed:
    <<: *app
    command: ["node", "tools/scripts/seed.mts"]
    profiles: [tools]

volumes:
  postgres_data:
