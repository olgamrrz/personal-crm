# Production on the server: docker compose project "prod" in /opt/crm/prod.
# GitHub Actions uploads the whole deploy/ folder there; .env next to it holds the settings
# (see .env.example). APP_IMAGE is set by deploy.sh and restore.sh.

x-database-url: &database-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Every container made from the app image; each service lists its own settings below
x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE is not set, deploy with deploy.sh}
  depends_on:
    db:
      condition: service_healthy
  logging: *logging

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # Error details (DETAIL, HINT, QUERY, CONTEXT) quote the values of the failed row, i.e. personal data;
    # terse keeps them out of the log. Logged statements show only $1, $2 placeholders.
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    <<: *app
    restart: unless-stopped
    # A missing line in .env stops the deploy right here, before the backup and the new container
    environment:
      DATABASE_URL: *database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is not set in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is not set in .env}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is not set in .env}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is not set in .env}
      SMTP_SECURE: ${SMTP_SECURE:?SMTP_SECURE is not set in .env}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is not set in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is not set in .env}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is not set in .env}
    ports:
      # Localhost only: nginx on this server proxies app.olgamrzvcrm.ru here
      - "127.0.0.1:3000:3000"

  # One-off containers from the app image: docker compose -p prod run --rm migrate|seed
  # OWNER_EMAIL: whose the data is that exists before sign-in (the migration 0004_owners) and who gets demo data
  migrate:
    <<: *app
    command: ["node", "tools/scripts/migrate.mts"]
    environment:
      DATABASE_URL: *database-url
      OWNER_EMAIL: ${OWNER_EMAIL:?OWNER_EMAIL is not set in .env}
    profiles: [tools]

  seed:
    <<: *app
    command: ["node", "tools/scripts/seed.mts"]
    environment:
      DATABASE_URL: *database-url
      OWNER_EMAIL: ${OWNER_EMAIL:?OWNER_EMAIL is not set in .env}
    profiles: [tools]

volumes:
  postgres_data:
