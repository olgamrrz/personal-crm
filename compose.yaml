# Local development: only PostgreSQL and the Mailpit mail stub run in Docker.
# Connection settings are read from .env (see .env.example).
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # Same as on the server (deploy/compose.yaml): error details quote personal data, terse leaves them out
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    ports:
      # Bind to localhost only, so the database is not reachable from the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Catches every email the app sends, so nothing reaches real addresses
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      # SMTP and the web page are bound to localhost only
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
