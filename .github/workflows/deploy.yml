# Push to main -> image tagged with the commit SHA -> GHCR -> deploy on the server.
# The server side lives in deploy/: this workflow only uploads it and calls deploy.sh.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running deploy instead of cutting it off
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/olgamrrz/personal-crm
  SERVER: crmapp@176.12.67.9
  DEPLOY_DIR: /opt/crm/prod
  APP_URL: https://app.olgamrzvcrm.ru

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload deploy scripts
        run: scp -o BatchMode=yes deploy/compose.yaml deploy/deploy.sh "$SERVER:$DEPLOY_DIR/"

      - name: Migrate, start new image, smoke /health
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | ssh -o BatchMode=yes "$SERVER" "bash $DEPLOY_DIR/deploy.sh --registry-user $REGISTRY_USER $GITHUB_SHA"

      - name: Check public address
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$APP_URL/health"
