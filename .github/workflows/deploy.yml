# Push to main -> image tagged with the commit SHA -> GHCR -> deploy to staging and to prod.
# The server side lives in deploy/: this workflow only uploads it and calls deploy.sh with the environment.
# Staging and prod are deployed independently of each other: both wait only for the build.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/olgamrrz/personal-crm
  SERVER: crmapp@176.12.67.9

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    # One deploy at a time per environment; a newer push waits for the running deploy instead of cutting it off
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # Shows the staging link under this job on the run page and in the repo's Deployments
    environment:
      name: staging
      url: https://test-app.olgamrzvcrm.ru
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /opt/crm/staging
      APP_URL: https://test-app.olgamrzvcrm.ru
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The whole deploy/ folder, so a new script there reaches the server by itself.
      # Files that exist only on the server (.env, current-image) stay as they are;
      # --no-overwrite-dir keeps the owner and mode of the server folder, --touch skips file times
      - name: Upload deploy folder
        shell: bash
        run: |
          tar --create --file=- --directory=deploy . \
            | ssh -o BatchMode=yes "$SERVER" "tar --extract --file=- --directory=$DEPLOY_DIR --no-overwrite-dir --touch"

      - name: Migrate, start new image, smoke /health
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | ssh -o BatchMode=yes "$SERVER" "bash $DEPLOY_DIR/deploy.sh --registry-user $REGISTRY_USER staging $GITHUB_SHA"

      # The test domain is closed by a password: 401 means nginx and the certificate work.
      # The app itself was checked by the smoke test above, on the server.
      - name: Check public address
        run: |
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 5 --retry-all-errors --retry-delay 3 "$APP_URL/health")
          echo "$APP_URL/health answered $code"
          test "$code" = 401

  deploy-prod:
    name: Deploy to prod
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    # Shows the app link under this job on the run page and in the repo's Deployments
    environment:
      name: production
      url: https://app.olgamrzvcrm.ru
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /opt/crm/prod
      APP_URL: https://app.olgamrzvcrm.ru
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The whole deploy/ folder, so a new script there reaches the server by itself.
      # Files that exist only on the server (.env, current-image, backups/) stay as they are;
      # --no-overwrite-dir keeps the owner and mode of the server folder, --touch skips file times
      - name: Upload deploy folder
        shell: bash
        run: |
          tar --create --file=- --directory=deploy . \
            | ssh -o BatchMode=yes "$SERVER" "tar --extract --file=- --directory=$DEPLOY_DIR --no-overwrite-dir --touch"

      - name: Back up database, migrate, start new image, smoke /health
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | ssh -o BatchMode=yes "$SERVER" "bash $DEPLOY_DIR/deploy.sh --registry-user $REGISTRY_USER prod $GITHUB_SHA"

      - name: Check public address
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$APP_URL/health"
