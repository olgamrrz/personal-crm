schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: personal CRM for people the owner knows personally, not for sales.
  Product idea, main scenario, constraints and non-goals: specs/01-продуктовая-идея.md
  Working rules, stack and deploy: CLAUDE.md
  The owner is not a developer: write proposal and specs in plain words.
  Product decisions belong to the owner: anything not in the product idea goes
  to open questions in proposal.md instead of being decided silently.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
