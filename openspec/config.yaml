schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: personal CRM for people the owner knows personally, not for sales.
  Product idea, main scenario, constraints and non-goals: specs/01-продуктовая-идея.md
  Working rules, stack and deploy: CLAUDE.md
  The owner is not a developer: write proposal and specs in plain words.
  Product decisions belong to the owner: anything not in the product idea goes
  to open questions in proposal.md instead of being decided silently.



rules:
   proposal:
     - Keep proposals under 500 words
     - Always state what is out of scope
   specs:
     - Every scenario has its own test
   tasks:
       - Break tasks into chunks of max 2 hours
        - Test before code - write the test, run it and see it fail, then write the code and see the test pass

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
